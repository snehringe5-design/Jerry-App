name: Jerry AI Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lld

    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip
        pip3 install --user buildozer cython==0.29.33

    - name: Set up Android SDK & Pre-install Tools
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d temp_tools
        cp -r temp_tools/cmdline-tools/* $ANDROID_HOME/tools/
        rm -rf cmdline-tools.zip temp_tools

        # Setup paths and accept licenses in advance
        export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb139a648b0" >> $ANDROID_HOME/licenses/android-sdk-license

        # Pre-install build-tools 37 along with others so license is never missed
        yes | sdkmanager --licenses || true
        yes | sdkmanager "platforms;android-33" "build-tools;37.0.0" "build-tools;33.0.2" "platform-tools" || true

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        export PATH=$PATH:$HOME/.buildozer/android/platform/android-sdk/tools/bin
        export PATH=$PATH:$HOME/.buildozer/android/platform/android-sdk/platform-tools
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jerry-apk
        path: bin/*.apk
        
