name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer Action
      uses: kivy/buildozer-action@v1
      with:
        command: buildozer --profile auto android debug
        subpath: '.'

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Jerry-AI-APK
        path: bin/*.apk
        
