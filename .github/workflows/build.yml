name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
          pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev build-essential

    - name: Install Python Tools
      run: |
        python -m pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer kivy

    - name: Build APK with Buildozer
      run: |
        buildozer --profile auto android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Jerry-AI-APK
        path: bin/*.apk
        
