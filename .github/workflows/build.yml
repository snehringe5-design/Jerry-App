name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-python310-v12
        restore-keys: |
          ${{ runner.os }}-buildozer-python310-

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install --user --upgrade buildozer cython==0.29.36

    - name: Disable Cmake Tests Globally
      run: |
        # Yeh step CMake ke default behavior ko rokti hai jisse test targets build mein include na ho
        echo "set(BUILD_TESTING OFF CACHE BOOL \"\" FORCE)" | sudo tee -a /usr/share/cmake-*/Modules/CMakeLists.txt 2>/dev/null || true
        mkdir -p ~/.gradle

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer -v android debug || {
          echo "=== BUILD FAILED, SEARCHING AND PRINTING LOGS ==="
          find /home/runner/.buildozer -name "*.txt" -o -name "*.log" | while read logfile; do
            echo "=========================================="
            echo "FILE: $logfile"
            echo "=========================================="
            tail -n 120 "$logfile"
          done
          exit 1
        }

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        
