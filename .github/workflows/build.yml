name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
      ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git tar gzip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev \
              build-essential ccache libltdl-dev

      - name: Upgrade Pip, Setuptools and Install Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --upgrade cython==0.29.36
          python3 -m pip install --upgrade buildozer
          python3 -m pip install --upgrade python-for-android

      - name: Prepare SDK, NDK and Accept Licenses
        run: |
          rm -rf /usr/local/lib/android/sdk/ndk/*
          rm -rf ~/.buildozer
          
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          PLATFORM_DIR="$HOME/.buildozer/android/platform"
          
          mkdir -p "$SDK_DIR/cmdline-tools/latest"
          mkdir -p "$SDK_DIR/tools/bin"
          mkdir -p "$SDK_DIR/licenses"
          mkdir -p "$PLATFORM_DIR"

          # 1. कमांड-लाइन टूल्स सेटअप करना
          cd "$SDK_DIR"
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline-tools.zip
          
          if [ -d "bin" ]; then
            mv bin lib source.properties cmdline-tools/latest/
          elif [ -d "cmdline-tools" ]; then
            mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          fi
          rm cmdline-tools.zip

          cp -r cmdline-tools/latest/bin/* tools/bin/ || true
          cp -r cmdline-tools/latest/lib tools/ || true

          # 2. एंड्रॉइड लाइसेंस सेट करना
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > licenses/android-sdk-license
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fb8" >> licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a648db" >> licenses/android-sdk-license

          # 3. NDK r25b डाउनलोड करना
          cd "$PLATFORM_DIR"
          curl -o android-ndk-r25b-linux.zip https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          rm android-ndk-r25b-linux.zip

          # 4. सटीक API 33 इंस्टॉल करना
          export PATH=$PATH:$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/tools/bin
          yes | sdkmanager --licenses || true
          sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          
