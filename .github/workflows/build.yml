name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies (including Ant)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libsqlite3-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            ant

      - name: Cache Buildozer & Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.buildozer
          key: ${{ runner.os }}-buildozer-sdk-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-sdk-v3-

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install --upgrade git+https://github.com/kivy/buildozer.git@master
          pip install --upgrade git+https://github.com/kivy/python-for-android.git@master

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare SDK for Buildozer
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          
          if [ -d "/home/runner/.buildozer/android/platform/android-sdk" ]; then
            echo "SDK already cached, skipping download!"
          else
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;25.2.9519653"

            mkdir -p /home/runner/.buildozer/android/platform
            rm -rf /home/runner/.buildozer/android/platform/android-sdk
            cp -r $ANDROID_HOME /home/runner/.buildozer/android/platform/android-sdk
          fi

      - name: Build Android APK with Buildozer
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-sdk/ndk/25.2.9519653
          ANT_HOME: /usr/share/ant
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          
