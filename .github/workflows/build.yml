name: Jerry AI Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer Action
      uses: kivy/buildozer-action@v1
      with:
        bundlename: debug
        update_defaults: true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jerry-apk
        path: bin/*.apk
        
