name: Jerry AI Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lld autoconf-archive libltdl-dev gettext

    - name: Install Buildozer, Cython, and p4a
      run: |
        pip3 install --upgrade pip
        pip3 install --user --upgrade buildozer cython==0.29.33 python-for-android

    - name: Cache Buildozer Global Directory
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.local/share/buildozer
        key: ${{ runner.os }}-buildozer-v2-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-v2-

    - name: Set up Android SDK & Bridge Buildozer Paths
      run: |
        ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        
        if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d temp_tools
          cp -r temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf cmdline-tools.zip temp_tools
        fi

        mkdir -p $ANDROID_HOME/tools
        if [ ! -L "$ANDROID_HOME/tools/bin" ]; then
          ln -s $ANDROID_HOME/cmdline-tools/latest/bin $ANDROID_HOME/tools/bin
          ln -s $ANDROID_HOME/cmdline-tools/latest/lib $ANDROID_HOME/tools/lib
        fi

        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb139a648b0" >> $ANDROID_HOME/licenses/android-sdk-license

        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        yes | sdkmanager --licenses || true
        yes | sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer --debug -v android debug

    - name: Print Error Log on Failure
      if: failure()
      run: |
        echo "=== SEARCHING FOR BUILD ERROR ==="
        find ~/.buildozer -name "*.log" -exec tail -n 120 {} \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jerry-apk
        path: bin/*.apk
        
