name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36
          pip install buildozer

      - name: Prepare Android SDK and Fake Old Tools Path
        run: |
          rm -rf ~/.buildozer
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools/latest"
          mkdir -p "$SDK_DIR/tools/bin"
          mkdir -p "$SDK_DIR/licenses"

          # कमांड-लाइन टूल्स डाउनलोड और एक्सट्रैक्ट करना
          cd "$SDK_DIR"
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline-tools.zip
          
          if [ -d "bin" ]; then
            mv bin lib source.properties cmdline-tools/latest/
          elif [ -d "cmdline-tools" ]; then
            mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          fi
          rm cmdline-tools.zip

          # बिल्डोजर जिस 'tools/bin/sdkmanager' को खोजता है, उसे वहाँ डायरेक्ट लिंक या कॉपी कर देना
          cp -r cmdline-tools/latest/bin/* tools/bin/ || true
          cp -r cmdline-tools/latest/lib tools/ || true

          # एंड्रॉइड लाइसेंस खुद से जनरेट करके डाल देना ताकि कभी अटके नहीं
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > licenses/android-sdk-license
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fb8" >> licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a648db" >> licenses/android-sdk-license

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          
