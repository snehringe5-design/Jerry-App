name: Jerry AI Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lld autoconf-archive libltdl-dev gettext patchelf

    - name: Install Stable Cython and Buildozer
      run: |
        pip3 install --upgrade pip
        pip3 install --upgrade buildozer "cython==0.29.33" python-for-android

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      id: cache-buildozer
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Manual SDK, NDK & Ant Setup
      if: steps.cache-buildozer.outputs.cache-hit != 'true'
      run: |
        mkdir -p $HOME/.buildozer/android/platform
        
        # Download and extract NDK r25b
        echo "Downloading NDK..."
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
        unzip -q ndk.zip -d $HOME/.buildozer/android/platform/
        rm ndk.zip

        # Setup Android SDK & Tools
        ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d temp_tools
        cp -r temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf cmdline-tools.zip temp_tools

        # Setup tools/bin for buildozer compatibility
        mkdir -p $ANDROID_HOME/tools/bin
        ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager $ANDROID_HOME/tools/bin/avdmanager

        # Download Apache Ant manually
        wget -q https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.4-bin.tar.gz -O ant.tar.gz
        tar -xzf ant.tar.gz -C $HOME/.buildozer/android/platform/
        rm ant.tar.gz

        # Accept licenses
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb139a648b0" >> $ANDROID_HOME/licenses/android-sdk-license

        export PATH=$PATH:$ANDROID_HOME/tools/bin
        yes | sdkmanager --licenses || true
        yes | sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

    - name: Build APK with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        export CFLAGS="-Wno-error=incompatible-pointer-types -Wno-error=int-conversion"
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jerry-apk
        path: bin/*.apk
        
