name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with: {python-version: '3.10'}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev
        pip install --upgrade pip buildozer cython==0.29.36
    - name: Build
      run: buildozer --debug -v android debug
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        
