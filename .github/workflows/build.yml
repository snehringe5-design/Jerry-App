name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libsqlite3-dev \
            libffi-dev \
            libssl-dev \
            cmake

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer
          pip install --upgrade git+https://github.com/kivy/buildozer.git@master

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 33 and Link for Buildozer
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;25.2.9519653" --sdk_root=$ANDROID_HOME

          # Create buildozer expected directories and link them to the system Android SDK
          mkdir -p /home/runner/.buildozer/android/platform
          ln -s $ANDROID_HOME /home/runner/.buildozer/android/platform/android-sdk
          
          # Also link build-tools 37 name to 33 so buildozer doesn't fail if it hardcodes 37
          mkdir -p $ANDROID_HOME/build-tools/37.0.0
          cp -r $ANDROID_HOME/build-tools/33.0.2/* $ANDROID_HOME/build-tools/37.0.0/

      - name: Build Android APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          
