name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-python311-v17
        restore-keys: |
          ${{ runner.os }}-buildozer-python311-

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        python -m pip install --upgrade pip
        pip install --user --upgrade buildozer cython==0.29.36

    - name: Accept Android SDK Licenses Safely
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # Yeh command Android SDK ke saare licenses ko bina kisi global 'yes' ke accept kar leti hai
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/licenses
        echo "24333f1a4326f6ad852b66fe46a58ed77332048d" > $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb139a648b0" >> $ANDROID_HOME/licenses/android-sdk-license

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer -v android debug || {
          echo "=== BUILD FAILED, SEARCHING AND PRINTING LOGS ==="
          find /home/runner/.buildozer -name "*.txt" -o -name "*.log" | while read logfile; do
            echo "=========================================="
            echo "FILE: $logfile"
            echo "=========================================="
            tail -n 120 "$logfile"
          done
          exit 1
        }

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        
