name: Jerry AI Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lld

    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip
        pip3 install --user buildozer cython==0.29.33

    - name: Set up Android SDK (Official Action)
      uses: android-actions/setup-android@v3

    - name: Install Required SDK Packages & Accept Licenses
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-33" "build-tools;37.0.0" "build-tools;33.0.2" "platform-tools"

    - name: Link SDK for Buildozer
      run: |
        mkdir -p $HOME/.buildozer/android/platform
        if [ ! -L "$HOME/.buildozer/android/platform/android-sdk" ]; then
          rm -rf $HOME/.buildozer/android/platform/android-sdk
          ln -s $ANDROID_HOME $HOME/.buildozer/android/platform/android-sdk
        fi

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jerry-apk
        path: bin/*.apk
        
