name: Build APK with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses-dev \
          cmake \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          ant

    - name: Set up Android SDK/NDK environment variables
      run: |
        echo "ANDROID_HOME=$HOME/.android" >> $GITHUB_ENV
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Build APK
      run: |
        buildozer --debug android debug || (echo "=== BUILD FAILED, CHECKING LOGS ===" && cat .buildozer/*.log || find . -name "*.log" -exec cat {} + || true)

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jerry-apk
        path: bin/*.apk
        
